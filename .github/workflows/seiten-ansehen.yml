name: Seiten ansehen
# Macht Screenshots (Desktop + Handy) und Textauszüge der Seiten aus werkzeug/urls.txt.
on:
  workflow_dispatch:
  push:
    paths: ['werkzeug/urls.txt']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node werkzeug/shots.mjs
      - name: Ergebnisse in Zweig 'shots' ablegen
        run: |
          git config user.name "falk-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan shots; git rm -rf . >/dev/null 2>&1 || true
          git checkout "$GITHUB_SHA" -- werkzeug/urls.txt 2>/dev/null || true
          git add -f shots werkzeug/urls.txt; git commit -qm "Screenshots"; git push -f origin shots
